<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERCAPY - Cobrar</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:15px}
.caja{background:white;padding:20px;border-radius:15px;max-width:450px;margin:auto}
h1{text-align:center;color:#00a650}
label{font-weight:bold;display:block;margin-top:12px}
input{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;background:#00a650;color:white;padding:13px;border:none;border-radius:10px;font-size:17px;margin-top:20px;font-weight:bold}
.resultado{background:#eafff1;border:2px solid #00a650;padding:15px;border-radius:12px;margin-top:20px;display:none}
.metodo{background:white;padding:12px;border-radius:10px;margin-top:10px;border:1px solid #ddd}
.wa{background:#25D366;color:white;text-align:center;padding:12px;border-radius:10px;display:block;text-decoration:none;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<div class="caja">
<h1>MERCAPY 💰</h1>
<p style="text-align:center">Solo para Vendedor</p>

<label>Nombre Completo</label>
<input id="nombre" placeholder="Ej: Reinerio Ayala">

<label>Número de Cédula</label>
<input id="cedula" placeholder="Ej: 4.123.456">

<label>Número de WhatsApp (con 595 sin 0)</label>
<input id="whatsapp" placeholder="Ej: 595991247112">

<h3>🏦 TRANSFERENCIA</h3>
<label>Alias</label>
<input id="alias" placeholder="Tu alias">
<label>CBU / N° Cuenta</label>
<input id="cbu" placeholder="Tu CBU o cuenta">

<h3>💵 USDT - TRC20</h3>
<label>Tu billetera USDT (empieza con T)</label>
<input id="usdt" placeholder="Txxxxxxxxxxxx">

<button onclick="mostrar()">MOSTRAR MI CAJA DE COBRO</button>
<div id="resultado" class="resultado"></div>
</div>

<script>
function mostrar(){
let nombre=document.getElementById('nombre').value;
let cedula=document.getElementById('cedula').value;
let wa=document.getElementById('whatsapp').value;
let alias=document.getElementById('alias').value;
let cbu=document.getElementById('cbu').value;
let usdt=document.getElementById('usdt').value;

let html = "<h2>✅ DATOS PARA PAGAR</h2>";
html += "<b>Vendedor:</b> " + nombre + "<br>";
html += "<b>Cédula:</b> " + cedula + "<br><br>";
html += "<div class='metodo'><b>🏦 TRANSFERENCIA</b><br>Alias: " + alias + "<br>CBU / Cuenta: " + cbu + "</div>";
html += "<div class='metodo'><b>💵 USDT - TRC20</b><br>Billetera: " + usdt + "<br>Red: TRC20 - Tron</div>";

let mensaje = "Hola " + nombre + " quiero pagarte en MERCAPY.%0A%0A";
mensaje += "Vendedor: " + nombre + "%0A";
mensaje += "Cedula: " + cedula + "%0A%0A";
mensaje += "🏦 TRANSFERENCIA - Alias: " + alias + " - CBU: " + cbu + "%0A";
mensaje += "💵 USDT TRC20: " + usdt;

html += "<a class='wa' href='https://wa.me/"+wa+"?text="+mensaje+"' target='_blank'>📲 PAGAR POR WHATSAPP</a>";
document.getElementById('resultado').innerHTML = html;
document.getElementById('resultado').style.display = 'block';
}
</script>
</body>
</html>
