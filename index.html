<script>
const SUPABASE_URL = "https://fbnblubqwrajgdoruyzk.supabase.co";
const SUPABASE_KEY = "sb_publishable_FO_GQl2aMBnOX8NH3d5rBg_OB5r_htf";
let fotoBase64 = "";

function verFoto(e){
  var file = e.target.files[0];
  var reader = new FileReader();
  reader.onload = function(ev){
    fotoBase64 = ev.target.result;
    var img = document.getElementById('preview');
    img.src = fotoBase64;
    img.style.display='block';
  };
  reader.readAsDataURL(file);
}
function compartir(nombre, precio){
  var texto = "🔥 Mirá esto en MERCA PY 🛍️%0A" + nombre + " - " + precio + "%0AComprá acá: https://mercapy.github.io/Mercapy-/";
  window.open("https://wa.me/?text=" + texto, "_blank");
}

async function cargarProductos(){
  const res = await fetch(SUPABASE_URL + "/rest/v1/productos?select=*&order=id.desc", {
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  });
  const productos = await res.json();
  const lista = document.getElementById('lista-productos');
  if(!productos || productos.length === 0){
    document.getElementById('vacio').style.display='block';
    return;
  }
  lista.innerHTML = productos.map(p => `
    <div class="producto">
      <img src="${p.foto || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=80'}">
      <h3>${p.nombre || 'Producto'}</h3>
      <p>Vendedor: ${p.vendedor || ''} - ${p.descripcion || ''}</p>
      <p class="precio">${p.precio || ''} Gs</p>
      <button class="btn-comprar" onclick="window.open('https://wa.me/${p.whatsapp || ''}?text=Hola, quiero comprar ${p.nombre || ''}')">💬 Comprar por WhatsApp</button>
      <button class="btn-compartir" onclick="compartir('${p.nombre || ''}','${p.precio || ''}')">↗️ Compartir mi producto</button>
    </div>
  `).join("");
}

async function publicar(){
  var nombre = document.getElementById('nombre').value;
  var prod = document.getElementById('prod').value;
  var precio = document.getElementById('precio').value;
  var ciudad = document.getElementById('ciudad').value;
  var wha = document.getElementById('wha').value;
  var whaLimpio = "595" + wha.replace(/\D/g,'').replace(/^0/,'').replace(/^595/,'');

  if(!prod || !precio){ alert("Poné nombre del producto y precio, Rey"); return; }

  const res = await fetch(SUPABASE_URL + "/rest/v1/productos", {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=representation" },
    body: JSON.stringify({ nombre: prod, precio: precio, vendedor: nombre, whatsapp: whaLimpio, descripcion: ciudad, foto: fotoBase64 })
  });

  if(res.ok){ alert("✅ ¡Publicado! Ya aparece en MERCA PY"); cargarProductos(); }
  else { alert("Error al publicar, revisá Supabase"); }
}

cargarProductos();
if(window.location.search.includes('soy-reinerio')){ document.getElementById('admin').style.display='block'; }
</script>
