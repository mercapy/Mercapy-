<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobrar - MERCAPY</title>
</head>
<body style="background:#f2f2f2;margin:0;padding:15px;font-family:Arial,sans-serif">

<div style="max-width:420px;margin:0 auto;background:white;border:2px solid #111;border-radius:14px;padding:16px">
<h2 style="text-align:center;margin:0">💳 MERCAPY - COBRAR</h2>
<p style="text-align:center;font-size:13px;color:#555">Cada vendedor cobra con SUS datos</p>

<label><b>Nombre del producto:</b></label><br>
<input id="v-nombre" placeholder="Ej: Celular Samsung" style="width:100%;padding:11px;margin:5px 0 10px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box"><br>

<label><b>Precio en Guaraníes:</b></label><br>
<input id="v-precio" placeholder="Ej: 500000" style="width:100%;padding:11px;margin:5px 0 12px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box"><br>

<h3 style="margin:10px 0 5px">💳 ¿CÓMO QUERÉS COBRAR?</h3>

<b>1. GUARANÍES - TRANSFERENCIA</b><br>
<input id="v-alias" placeholder="Tu Alias - Ej: 0991123456" style="width:100%;padding:11px;margin:5px 0 5px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box"><br>
<input id="v-banco" placeholder="Tu Banco - Ej: Familiar" style="width:100%;padding:11px;margin:0 0 10px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box"><br>

<b>2. GUARANÍES - GIRO TIGO</b><br>
<input id="v-giro" placeholder="Tu Giro Tigo - Ej: 0991 123 456" style="width:100%;padding:11px;margin:5px 0 10px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box"><br>

<b>3. USDT TRC20</b><br>
<input id="v-usdt" placeholder="Tu billetera USDT - Ej: TXXXX..." style="width:100%;padding:11px;margin:5px 0 10px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box"><br>

<b>Tu WhatsApp</b><br>
<input id="v-wsp" placeholder="Ej: 595991123456" style="width:100%;padding:11px;margin:5px 0 12px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box"><br>

<button onclick="mostrar()" style="width:100%;background:#FFD700;padding:13px;border:none;border-radius:10px;font-weight:bold;font-size:16px">MOSTRAR MI CAJA DE COBRO ✅</button>

<div id="ver" style="display:none;margin-top:15px;background:#FFF8E1;border:2px solid #FFD700;border-radius:12px;padding:12px">
<div id="datos"></div>
</div>
</div>

<script>
function mostrar(){
  var n = document.getElementById('v-nombre').value;
  var p = document.getElementById('v-precio').value;
  var a = document.getElementById('v-alias').value;
  var b = document.getElementById('v-banco').value;
  var g = document.getElementById('v-giro').value;
  var u = document.getElementById('v-usdt').value;
  var w = document.getElementById('v-wsp').value;
  if(!n || !p){ alert('Pone nombre y precio'); return; }
  if(!a && !g && !u){ alert('Pone por lo menos tu Alias, tu Giro o tu USDT'); return; }
  var h = '<b>'+n+'</b><br><b style="font-size:20px">Gs. '+p+'</b><br><br><b>💳 METODOS DE PAGO:</b><br><br>';
  if(a) h += '<div style="background:white;border-radius:8px;padding:10px;margin-bottom:8px">🏦 <b>TRANSFERENCIA EN GUARANÍES</b><br>Alias: <b>'+a+'</b><br>Banco: <b>'+b+'</b></div>';
  if(g) h += '<div style="background:white;border-radius:8px;padding:10px;margin-bottom:8px">📱 <b>GIRO TIGO EN GUARANÍES</b><br>Número: <b>'+g+'</b></div>';
  if(u) h += '<div style="background:#111;color:white;border-radius:8px;padding:10px;margin-bottom:8px">🪙 <b>USDT TRC20</b><br><span style="color:#FFD700;word-break:break-all">'+u+'</span></div>';
  if(w) h += '<a href="https://wa.me/'+w+'" style="display:block;background:#25D366;color:white;text-align:center;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold">📲 COMPRAR POR WHATSAPP</a>';
  document.getElementById('datos').innerHTML = h;
  document.getElementById('ver').style.display = 'block';
}
</script>
</body>
</html>
